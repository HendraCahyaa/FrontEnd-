<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        width: 343px;
        border-radius: 10px;
        overflow: hidden;
      }
      .img {
        object-fit: cover;
        display: block;
        width: 343px;
        height: 240px;
      }
      .content {
        padding: 24px;
      }
      .overline {
        margin-bottom: 16px;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 12px;
        line-height: 100%;
        letter-spacing: 5px;
        color: #6c7289;
      }
      .display {
        margin-bottom: 16px;
        font-weight: 700;
        font-size: 32px;
        line-height: 32px;
        font-family: "Fraunces", serif;
        letter-spacing: 0px;
        color: #1c232b;
      }
      .description {
        margin-bottom: 20px;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 14px;
        line-height: 23px;
        color: #6c7289;
        letter-spacing: 0px;
      }
      .price {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
      }
      .discount {
        color: #3d8168;
        font-weight: 700;
        font-family: "Fraunces", serif;
        font-size: 32px;
        line-height: 32px;
        letter-spacing: 0px;
      }
      .price-normal {
        margin-left: 10px;
        color: #6c7289;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 13px;
        line-height: 23px;
        text-decoration: line-through;
        letter-spacing: 0px;
      }
      button {
        margin-top: 20px;
        background-color: #3d8168;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 48px;
        border-radius: 8px;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 14px;
        line-height: 100%;
        letter-spacing: 0px;
        text-align: center;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #245a45;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="img" src="Bitmap.png" alt="Bitmap" />
      <div class="content">
        <p class="overline">PERFUME</p>
        <p class="display">Gabrielle Essence Eau De Parfum</p>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <p class="discount">$149.99</p>
          <p class="price-normal">$169.99</p>
        </div>
        <button>
          <i class="bi bi-cart3" style="padding-right: 10px"></i>add to cart
        </button>
      </div>
    </div>
  </body>
</html>
