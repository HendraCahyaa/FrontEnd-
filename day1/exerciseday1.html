<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f2f2f2;
      }
      .container {
        width: 343px;
        border-radius: 10px;
        overflow: hidden;
        background-color: #ffffff;
      }
      .img {
        background: url(Bitmap.png);
        object-fit: cover;
        display: block;
        width: 343px;
        height: 240px;
      }
      .content {
        padding: 24px;
      }
      .overline {
        margin-bottom: 16px;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 12px;
        line-height: 100%;
        letter-spacing: 5px;
        color: #6c7289;
      }
      .display {
        margin-bottom: 16px;
        font-weight: 700;
        font-size: 32px;
        line-height: 32px;
        font-family: "Fraunces", serif;
        letter-spacing: 0px;
        color: #1c232b;
      }
      .description {
        margin-bottom: 20px;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 14px;
        line-height: 23px;
        color: #6c7289;
        letter-spacing: 0px;
      }
      .price {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
      }
      .discount {
        color: #3d8168;
        font-weight: 700;
        font-family: "Fraunces", serif;
        font-size: 32px;
        line-height: 32px;
        letter-spacing: 0px;
      }
      .price-normal {
        margin-left: 10px;
        color: #6c7289;
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 13px;
        line-height: 23px;
        text-decoration: line-through;
        letter-spacing: 0px;
      }
      button {
        margin-top: 20px;
        background-color: #3d8168;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 48px;
        border-radius: 8px;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 14px;
        line-height: 100%;
        letter-spacing: 0px;
        text-align: center;
        border: none;
        cursor: pointer;
      }
      .cart {
        width: 14px;
        height: 16px;
        margin-right: 8px;
      }
      @media (min-width: 769px) {
        .container {
          width: 600px;
          height: 450px;
          display: flex;
          background-color: #ffffff;
        }
        .img {
          width: 300px;
          height: 450px;
          background: url(Bitmap2.png);
        }
        .content {
          width: 300px;
        }
        .overline {
          padding-top: 10px;
        }
        .display {
          padding-top: 16px;
        }
        .description {
          padding-top: 12px;
        }

        .button {
          padding-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="img"></div>
      <div class="content">
        <p class="overline">PERFUME</p>
        <p class="display">Gabrielle Essence Eau De Parfum</p>
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <p class="discount">$149.99</p>
          <p class="price-normal">$169.99</p>
        </div>
        <button><img src="Cart.png" alt="" class="cart" />add to cart</button>
      </div>
    </div>
  </body>
</html>
