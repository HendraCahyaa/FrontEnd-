<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
        /* universal selector */
        *{
            margin: 0;
            padding: 0;
        }

        /* elemen selector */
        h2{
            color: red;
        }
        /* id selector */
        #avanza{
            color: blue;
        }

        /* class selector */
        .pink{
            color: pink;
        }
        .size-besar{
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h2>selector</h2>
    <p id="avanza">Ini avanza</p>
    <p class="pink">Ini pajero</p>
    <p class="pink size-besar">Ini mobilio</p>
</body>
</html>
