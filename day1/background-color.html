<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background color</title>
    <style>
        .background1{
            background-color: blue;
            height: 400px;
        }
        .background2{
            background-color: purple;
            height: 400px;
        }
        .background3{
            background: url(gambar_pemandangan.jpg);
            height: 600px;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="background1">container1</div>
    <div class="background2">container2</div>
    <div class="background3">container3</div>
</body>
</html>
