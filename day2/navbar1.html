<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar 1</title>
    <style>
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid black;
        padding: 12px;
      }
      .nav-item {
        display: flex;
        gap: 24px;
      }
      .background-test {
        width: 400px;
        height: 200px;
        border: 1px solid red;
        background: linear-gradient(90deg, red, yellow, green);
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1 class="nav-logo">Logo</h1>
      <div class="nav-item">
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
      </div>
    </div>
    <div class="background-test"></div>
  </body>
</html>
