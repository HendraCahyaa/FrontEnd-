<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 3px solid red;
        width: 600px;
        height: 3000px;
        margin: auto;
      }
      .kotak1 {
        width: 200px;
        height: 200px;
        background-color: aqua;
      }
      .kotak2 {
        width: 200px;
        height: 200px;
        background-color: blueviolet;
        position: sticky;
        top: 0;
      }
      .kotak3 {
        width: 200px;
        height: 200px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="kotak1"></div>
      <div class="kotak2"></div>
      <div class="kotak3"></div>
    </div>
  </body>
</html>
